<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico Gratuito | Brandspot</title>
  <meta name="description" content="Descubra se sua empresa tem perfil para um estúdio de conteúdo próprio. Diagnóstico gratuito em 2 minutos.">

  <!-- CoFo Gothic Variable — mesma fonte do site Brandspot (Adobe Typekit) -->
  <link rel="stylesheet" href="https://use.typekit.net/qeg5qhu.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'cofo-gothic-variable', sans-serif; background: #0f1729; color: #f5f5f5; overflow-x: hidden; min-height: 100vh; }

    /* ── Tokens ── */
    :root {
      --teal:         #028384;
      --teal-dim:     rgba(2, 131, 132, 0.18);
      --teal-border:  rgba(2, 131, 132, 0.45);
      --dark:         #0f1729;
      --card:         rgba(255,255,255,0.055);
      --card-hover:   rgba(2, 131, 132, 0.14);
      --border:       rgba(255,255,255,0.11);
      --text:         #f5f5f5;
      --muted:        rgba(245,245,245,0.58);
    }

    /* ── Background (fixed, behind everything) ── */
    #bg-photo {
      position: fixed; inset: 0; z-index: 0;
      background: url('assets/background.jpg') center/cover no-repeat;
    }
    #bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: rgba(15,23,41,0.65);
    }

    /* ── App wrapper ── */
    #app {
      position: relative; z-index: 2;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* ── Utility ── */
    .screen {
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .centered { align-items: center; justify-content: center; text-align: center; }

    /* ── Animations ── */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin     { to   { transform:rotate(360deg); } }
    @keyframes barGrow  { from { width:0; } to { width:var(--target-w); } }

    .fade-up   { animation: fadeUp 0.5s ease both; }
    .delay-1   { animation-delay: 0.10s; }
    .delay-2   { animation-delay: 0.20s; }
    .delay-3   { animation-delay: 0.30s; }
    .delay-4   { animation-delay: 0.40s; }
    .delay-5   { animation-delay: 0.50s; }

    /* ════════════════════════════════════════
       HERO — medidas do Figma (Desktop 1440×1024)
       Fonte: CoFo Gothic Variable (Typekit)
       Black = 900 | Bold = 700 | Light = 200
    ════════════════════════════════════════ */
    .hero {
      padding: clamp(28px, 3.5vh, 44px) 24px clamp(36px, 4.5vw, 60px);
      gap: 0;
    }
    /* Logo: 266×104px centrado, topo 50px no Figma */
    .hero-logo {
      height: clamp(56px, 7vh, 88px);
      width: auto;
      margin-bottom: clamp(20px, 3.5vh, 40px);
    }
    /* Kicker "Diagnóstico gratuito": 26px Black #028384 */
    .hero-kicker {
      font-family: 'cofo-gothic-variable', sans-serif;
      font-weight: 900;
      font-size: clamp(13px, 1.4vw, 20px);
      color: var(--teal);
      letter-spacing: normal;
      margin-bottom: clamp(10px, 1.6vh, 18px);
    }
    /* Headline: 62px Black #f5f5f5 line-height 0.92 */
    .hero-title {
      font-family: 'cofo-gothic-variable', sans-serif;
      font-weight: 900;
      font-size: clamp(26px, 3.8vw, 56px);
      line-height: 0.92;
      max-width: 860px;
      margin-bottom: clamp(14px, 2vh, 26px);
      letter-spacing: -0.01em;
    }
    /* Subtext: 26px Light (#f5f5f5) com trechos Black  */
    .hero-sub {
      font-family: 'cofo-gothic-variable', sans-serif;
      font-weight: 200;
      font-size: clamp(13px, 1.4vw, 20px);
      line-height: 1.3;
      color: rgba(245,245,245,0.9);
      max-width: clamp(280px, 46vw, 660px);
      margin-bottom: clamp(24px, 3.5vh, 48px);
    }
    /* +R$100mil e 40% são Black no Figma */
    .hero-sub strong {
      font-weight: 900;
      color: var(--text);
    }

    .hero-cta { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: clamp(36px, 5vh, 64px); }

    /* Botão CTA */
    .btn-main {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--teal); color: var(--text);
      font-family: 'cofo-gothic-variable', sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 1.5vw, 22px);
      padding: clamp(13px, 1.8vh, 20px) clamp(28px, 2.4vw, 48px);
      max-width: 380px; width: 100%;
      border-radius: 100px; border: none;
      cursor: pointer; transition: background .2s, transform .15s;
      text-decoration: none; white-space: nowrap;
    }
    .btn-main:hover  { background: #029e9f; transform: translateY(-2px); }
    .btn-main:active { transform: translateY(0); }

    /* Badge "Leva só 2 min" */
    .badge-time {
      display: inline-flex; align-items: center; gap: 8px;
      background: #f5f5f5;
      color: #0f1729;
      font-family: 'cofo-gothic-variable', sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.1vw, 16px);
      padding: clamp(8px, 1.2vh, 13px) clamp(14px, 1.2vw, 22px);
      border-radius: 100px;
      white-space: nowrap;
    }
    .badge-time img { width: clamp(14px, 1.1vw, 19px); height: clamp(14px, 1.1vw, 19px); flex-shrink: 0; object-fit: contain; opacity: 1; }

    /* Ícones rodapé */
    .hero-icons {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: clamp(20px, 2.8vw, 52px); max-width: 860px;
    }
    .hero-icon {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; text-align: center;
    }
    .hero-icon img {
      width: clamp(38px, 3.2vw, 58px);
      height: clamp(38px, 3.2vw, 58px);
      object-fit: contain; opacity: 0.9;
    }
    .hero-icon span {
      font-family: 'cofo-gothic-variable', sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.3vw, 19px);
      color: #f5f5f5;
      max-width: 110px; line-height: 1;
    }

    /* ════════════════════════════════════════
       PROGRESS BAR
    ════════════════════════════════════════ */
    .progress-rail {
      position: fixed; top: 0; left: 0; right: 0; height: 3px;
      background: rgba(255,255,255,0.09); z-index: 50;
    }
    .progress-fill {
      height: 100%; background: var(--teal);
      transition: width .45s cubic-bezier(.4,0,.2,1);
    }

    /* ════════════════════════════════════════
       QUIZ
    ════════════════════════════════════════ */
    .quiz-screen {
      padding: 0 24px 60px;
      align-items: center;
    }
    .quiz-topbar {
      width: 100%; max-width: 800px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 32px 0 20px;
    }
    .quiz-logo   { height: 42px; }
    .quiz-counter {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900; font-size: 13px;
      color: var(--teal); letter-spacing: 1.2px; text-transform: uppercase;
    }
    .quiz-body { width: 100%; max-width: 800px; }
    .quiz-q {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900;
      font-size: clamp(22px, 3.8vw, 40px); line-height: 1.12;
      margin-bottom: 36px;
    }
    .quiz-opts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    .opt {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 18px 20px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      cursor: pointer; transition: background .18s, border-color .18s, transform .15s;
      text-align: left; width: 100%;
    }
    .opt:hover:not(.opt--sel) { background: var(--card-hover); border-color: var(--teal-border); transform: translateY(-2px); }
    .opt--sel { background: var(--teal); border-color: var(--teal); }
    .opt--sel .opt-l  { background: rgba(255,255,255,0.22); color: #fff; }
    .opt--sel .opt-tx { color: #fff; }
    .opt-l {
      flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center;
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 700; font-size: 13px;
      color: var(--teal); margin-top: 1px;
    }
    .opt-tx {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 15px; font-weight: 200;
      color: rgba(245,245,245,0.9); line-height: 1.45;
    }
    .quiz-foot { display: flex; align-items: center; margin-top: 32px; }
    .btn-back {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 6px; padding: 8px 0;
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 14px;
      color: rgba(245,245,245,0.45); transition: color .18s;
    }
    .btn-back:hover { color: var(--text); }
    .btn-back svg { width: 15px; flex-shrink: 0; }

    /* ════════════════════════════════════════
       FORM
    ════════════════════════════════════════ */
    .form-screen { padding: 48px 24px; }
    .form-wrap { width: 100%; max-width: 540px; }
    .form-kicker {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 700; font-size: 13px;
      color: var(--teal); letter-spacing: 1.2px; text-transform: uppercase;
      margin-bottom: 14px;
    }
    .form-title {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900;
      font-size: clamp(24px, 4vw, 36px); line-height: 1.1; margin-bottom: 10px;
    }
    .form-sub {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 15px;
      color: var(--muted); line-height: 1.55; margin-bottom: 38px;
    }
    .form-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .fgroup { display: flex; flex-direction: column; gap: 6px; }
    .fgroup label {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 11px; font-weight: 700;
      color: var(--teal); letter-spacing: 0.8px; text-transform: uppercase;
    }
    .fgroup input {
      background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px; padding: 14px 16px;
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 15px; color: var(--text);
      outline: none; width: 100%; transition: border-color .18s;
    }
    .fgroup input::placeholder { color: rgba(245,245,245,0.28); }
    .fgroup input:focus  { border-color: var(--teal); }
    .fgroup input.error  { border-color: #ef4444; }
    .form-privacy {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 12px;
      color: rgba(245,245,245,0.35); line-height: 1.55; margin-bottom: 24px;
    }
    .btn-submit {
      width: 100%; background: var(--teal); color: var(--text);
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900; font-size: 17px;
      padding: 20px; border-radius: 100px; border: none; cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn-submit:hover { background: #029e9f; transform: translateY(-1px); }

    /* ════════════════════════════════════════
       RESULTS
    ════════════════════════════════════════ */
    .results-screen { padding: 48px 24px 96px; align-items: center; }
    .results-inner  { width: 100%; max-width: 900px; }

    /* Score card */
    .score-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 48px;
      display: flex; gap: 52px; align-items: center;
      margin-bottom: 24px;
    }
    .gauge-wrap { position: relative; width: 174px; height: 174px; flex-shrink: 0; }
    .gauge-wrap svg { width: 100%; height: 100%; }
    .gauge-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .gauge-num {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900; font-size: 40px;
      line-height: 1; color: var(--text);
    }
    .gauge-label {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 12px;
      color: var(--muted); margin-top: 3px;
    }
    .score-info { flex: 1; min-width: 0; }
    .profile-tag {
      display: inline-flex; align-items: center; gap: 7px;
      border-radius: 100px; padding: 5px 14px;
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 700;
      font-size: 12px; letter-spacing: 0.5px; margin-bottom: 14px;
    }
    .tag-low  { background: rgba(245,158,11,.13); color: #FBBF24; border: 1px solid rgba(245,158,11,.3); }
    .tag-mid  { background: rgba(59,130,246,.13);  color: #60A5FA; border: 1px solid rgba(59,130,246,.3); }
    .tag-high { background: rgba(2,131,132,.18);   color: var(--teal); border: 1px solid var(--teal-border); }
    .profile-name {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900;
      font-size: clamp(20px, 2.8vw, 30px); line-height: 1.1; margin-bottom: 12px;
    }
    .profile-desc {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 15px; font-weight: 200;
      color: rgba(245,245,245,0.7); line-height: 1.65;
    }

    /* Section card */
    .section-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 36px; margin-bottom: 24px;
    }
    .section-label {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 700;
      font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--teal); margin-bottom: 20px;
    }

    /* Dimension bars */
    .dim-row {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dim-row:last-child { border-bottom: none; padding-bottom: 0; }
    .dim-name  {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 14px; font-weight: 700;
      color: rgba(245,245,245,0.82); min-width: 180px; flex-shrink: 0;
    }
    .dim-rail  { flex: 1; height: 7px; background: rgba(255,255,255,0.08); border-radius: 100px; overflow: hidden; }
    .dim-fill  {
      height: 100%; border-radius: 100px; background: var(--teal);
      width: 0; transition: width 1.1s cubic-bezier(.4,0,.2,1);
    }
    .dim-pct   {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 700; font-size: 13px;
      color: var(--teal); width: 40px; text-align: right; flex-shrink: 0;
    }

    /* Insights */
    .insight {
      display: flex; gap: 14px;
      padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .insight:last-child { border-bottom: none; padding-bottom: 0; }
    .i-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex-shrink: 0; margin-top: 8px; }
    .i-dot.opp { background: #FBBF24; }
    .i-text {
      font-family: 'cofo-gothic-variable', sans-serif; font-size: 15px; font-weight: 200;
      color: rgba(245,245,245,0.78); line-height: 1.65;
    }
    .i-text strong { color: var(--text); font-weight: 700; }

    /* CTA box */
    .cta-box {
      background: linear-gradient(135deg, rgba(2,131,132,.14), rgba(2,131,132,.04));
      border: 1px solid rgba(2,131,132,.3);
      border-radius: 20px; padding: 44px; text-align: center; margin-bottom: 24px;
    }
    .cta-box h3 {
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900;
      font-size: clamp(20px, 3vw, 28px); margin-bottom: 10px;
    }
    .cta-box p { font-family: 'cofo-gothic-variable', sans-serif; font-size: 15px; color: var(--muted); line-height: 1.55; margin-bottom: 28px; }
    .cta-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    .btn-specialist {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--teal); color: var(--text);
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 900; font-size: 16px;
      padding: 18px 32px; border-radius: 100px; border: none;
      cursor: pointer; text-decoration: none;
      transition: background .2s, transform .15s;
    }
    .btn-specialist:hover { background: #029e9f; transform: translateY(-2px); }

    .btn-pdf {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: rgba(245,245,245,0.78);
      font-family: 'cofo-gothic-variable', sans-serif; font-weight: 700; font-size: 16px;
      padding: 18px 32px; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.18);
      cursor: pointer; transition: all .2s;
    }
    .btn-pdf:hover { border-color: rgba(255,255,255,0.45); color: var(--text); transform: translateY(-2px); }

    /* Loading overlay */
    .loading {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(15,23,41,0.96);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid rgba(2,131,132,.25);
      border-top-color: var(--teal);
      animation: spin .75s linear infinite;
    }
    .loading p { font-family: 'cofo-gothic-variable', sans-serif; font-size: 15px; color: var(--muted); }

    /* ════════════════════════════════════════
       RESPONSIVE
    ════════════════════════════════════════ */
    @media (max-width: 680px) {
      .quiz-opts { grid-template-columns: 1fr; }
      .score-card { flex-direction: column; text-align: center; gap: 28px; padding: 32px 22px; }
      .gauge-wrap { width: 148px; height: 148px; }
      .section-card { padding: 24px 18px; }
      .dim-name { min-width: 130px; font-size: 13px; }
      .hero-icons { gap: 22px; }
      .cta-box { padding: 30px 20px; }
    }
    @media (max-width: 420px) {
      .quiz-q  { font-size: 20px; }
      .opt     { padding: 14px 14px; }
      .opt-tx  { font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="bg-photo"   aria-hidden="true"></div>
<div id="bg-overlay" aria-hidden="true"></div>
<div id="app"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   DATA
══════════════════════════════════════════════════════════════ */

const QUESTIONS = [
  {
    id: 'volume',
    dim: 'Volume e Alcance',
    text: 'Quantos conteúdos (vídeos, posts, artigos, e-mails, etc.) sua empresa produz por mês?',
    opts: [
      { t: 'Menos de 20 conteúdos',       s: 0 },
      { t: 'Entre 20 e 50 conteúdos',      s: 1 },
      { t: 'Entre 50 e 150 conteúdos',     s: 2 },
      { t: 'Mais de 150 conteúdos',        s: 3 },
    ]
  },
  {
    id: 'investimento',
    dim: 'Investimento',
    text: 'Qual é o investimento mensal em produção de conteúdo (equipe + fornecedores + ferramentas)?',
    opts: [
      { t: 'Menos de R$ 20 mil',                 s: 0 },
      { t: 'Entre R$ 20 mil e R$ 60 mil',        s: 1 },
      { t: 'Entre R$ 60 mil e R$ 120 mil',       s: 2 },
      { t: 'Acima de R$ 120 mil',                s: 3 },
    ]
  },
  {
    id: 'canais',
    dim: 'Volume e Alcance',
    text: 'Em quantos canais digitais sua empresa produz conteúdo regularmente?',
    opts: [
      { t: '1 ou 2 canais',    s: 0 },
      { t: '3 a 4 canais',     s: 1 },
      { t: '5 a 7 canais',     s: 2 },
      { t: '8 ou mais canais', s: 3 },
    ]
  },
  {
    id: 'equipe',
    dim: 'Capacidade Operacional',
    text: 'Como é estruturada a sua equipe de produção de conteúdo hoje?',
    opts: [
      { t: 'Não temos equipe dedicada',                         s: 0 },
      { t: '1 a 2 pessoas internas com apoio externo',          s: 1 },
      { t: 'Equipe de 3 a 8 pessoas dedicadas',                 s: 2 },
      { t: 'Time estruturado com mais de 8 profissionais',      s: 3 },
    ]
  },
  {
    id: 'planejamento',
    dim: 'Maturidade Estratégica',
    text: 'Sua empresa tem planejamento de conteúdo documentado e seguido pela equipe?',
    opts: [
      { t: 'Não temos planejamento formal',                              s: 0 },
      { t: 'Temos um planejamento básico e informal',                    s: 1 },
      { t: 'Planejamento estruturado, mas nem sempre executamos',        s: 2 },
      { t: 'Calendário editorial rigoroso e sempre cumprido',           s: 3 },
    ]
  },
  {
    id: 'consistencia',
    dim: 'Maturidade Estratégica',
    text: 'Como você avalia a consistência visual e técnica do conteúdo da sua empresa?',
    opts: [
      { t: 'Muito inconsistente — varia muito por produtor',   s: 0 },

function go(html, instant) {
  const app = document.getElementById('app');
  if (!instant) {
    app.style.opacity = '0';
    app.style.transform = 'translateY(10px)';
  }
  setTimeout(() => {
    app.innerHTML = html;
    app.style.transition = 'opacity .28s ease, transform .28s ease';
    requestAnimationFrame(() => {
      app.style.opacity = '1';
      app.style.transform = 'translateY(0)';
      onRendered();
    });
  }, instant ? 0 : 220);
}

function onRendered() {
  if (state.screen === 'results') {
    setTimeout(() => {
      document.querySelectorAll('.dim-fill[data-w]').forEach(el => {
        el.style.width = el.dataset.w + '%';
      });
    }, 80);
  }
}

function startQuiz() {
  state.qIndex  = 0;
  state.answers = [];
  showQuiz();
}

function pick(optIdx, score) {
  const q    = QUESTIONS[state.qIndex];
  const prev = state.answers.findIndex(a => a.id === q.id);
  const ans  = { id: q.id, optIdx, score };
  if (prev >= 0) state.answers[prev] = ans; else state.answers.push(ans);

  document.querySelectorAll('.opt').forEach((el, i) => {
    el.classList.toggle('opt--sel', i === optIdx);
  });

  setTimeout(() => {
    if (state.qIndex < QUESTIONS.length - 1) {
      state.qIndex++;
      showQuiz();
    } else {
      showForm();
    }
  }, 360);
}

function back() {
  if (state.screen === 'form') {
    state.qIndex = QUESTIONS.length - 1;
    showQuiz();
  } else if (state.screen === 'quiz' && state.qIndex > 0) {
    state.qIndex--;
    showQuiz();
  } else {
    showLanding();
  }
}

function submitForm(e) {
  e.preventDefault();
  const name    = document.getElementById('fn').value.trim();
  const role    = document.getElementById('fc').value.trim();
  const company = document.getElementById('fe').value.trim();
  const email   = document.getElementById('fm').value.trim();

  let ok = true;
  [['fn', name], ['fc', role], ['fe', company], ['fm', email]].forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (!val) { el.classList.add('error'); ok = false; }
    else el.classList.remove('error');
  });
  if (!email.includes('@')) { document.getElementById('fm').classList.add('error'); ok = false; }
  if (!ok) return;

  state.user = { name, role, company, email };
  showResults();
}

async function downloadPDF() {
  const loader = document.createElement('div');
  loader.className = 'loading';
  loader.innerHTML = '<div class="spinner"></div><p>Gerando seu PDF…</p>';
  document.body.appendChild(loader);

  try {
    const { jsPDF } = window.jspdf;
    const el = document.getElementById('pdf-target');

    const canvas = await html2canvas(el, {
      backgroundColor: '#0f1729',
      scale: 2,
      useCORS: true,
      allowTaint: true,
      logging: false,
    });

    const img  = canvas.toDataURL('image/jpeg', 0.94);
    const pdf  = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pw   = pdf.internal.pageSize.getWidth();
    const ph   = pdf.internal.pageSize.getHeight();
    const imgH = (canvas.height * pw) / canvas.width;

    if (imgH <= ph) {
      pdf.addImage(img, 'JPEG', 0, 0, pw, imgH);
    } else {
      let y = 0;
      while (y < imgH) {
        if (y > 0) pdf.addPage();
        pdf.addImage(img, 'JPEG', 0, -y, pw, imgH);
        y += ph;
      }
    }

    const slug = (state.user.company || 'empresa').toLowerCase().replace(/\s+/g, '_').replace(/[^\w]/g,'');
    pdf.save(`diagnostico_brandspot_${slug}.pdf`);
  } catch (err) {
    console.error(err);
    alert('Não foi possível gerar o PDF. Use Ctrl+P para imprimir como PDF.');
  } finally {
    document.body.removeChild(loader);
  }
}
